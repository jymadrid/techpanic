name: Manual public-source reading

# No schedule or data uploads. Live retrieval requires an explicit manual choice.
on:
  workflow_dispatch:
    inputs:
      run_live:
        description: Explicitly allow one live public-data query without artifacts
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  reading:
    if: inputs.run_live == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Query without publishing readings or evidence
        shell: bash
        run: |
          set +e
          python -m techpanic --quiet --data-dir data > run.log 2>&1
          code=$?
          set -e
          echo "public-source run exit code: $code; financial validity is not verified"
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then
            echo "::error::Live run failed; no raw response or reading is published"
            exit 1
          fi
          test -f data/output/latest.json
