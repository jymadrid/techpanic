name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint + tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
        exclude:
          # 3.10 只在 Linux 上验证，省 CI 额度；3.13 三平台全测
          - os: windows-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Lint
        run: ruff check src tests

      - name: Tests (offline, no network)
        run: pytest -q

      - name: Guard — repository must contain no data files
        shell: python
        run: |
          import pathlib, sys
          root = pathlib.Path(".").resolve()
          bad = []
          skip = {".git", ".venv", "venv", "htmlcov", ".pytest_cache", "node_modules", "data"}
          for pat in ("*.csv", "*.json", "*.xlsx", "*.parquet"):
              for p in root.rglob(pat):
                  if set(p.parts) & skip:
                      continue
                  # 允许仓库自身的元数据文件
                  if p.name in {"badge.json"}:
                      continue
                  bad.append(str(p.relative_to(root)))
          if bad:
              print("仓库内不应包含数据文件：", bad)
              sys.exit(1)
          print("OK：未发现数据文件")

  end-to-end:
    name: End-to-end with real network
    runs-on: ubuntu-latest
    needs: lint-and-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Run against live public data
        run: |
          set -o pipefail
          python -m techpanic --no-color --data-dir data 2>&1 | tee run.log
          code=${PIPESTATUS[0]}
          echo "exit code: $code"
          # 0 = 完全成功；2 = 部分降级（QVIX 滞后，正常）；3/4 = 真问题
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then
            echo "::error::端到端运行失败，退出码 $code"
            exit 1
          fi
          test -f data/output/latest.json
          test -f data/output/panic_index_tech_kcb.csv
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-run-log
          path: run.log
          if-no-files-found: ignore
